name: Build Shiv Khata Book Android APK & Play Store AAB

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Accept Android SDK Licenses
        run: |
          if [ -n "$ANDROID_HOME" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Prepare Release Keystore (Secrets or Auto-Generated Play Store Keystore)
        id: keystore
        working-directory: android/app
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p ../../release-info
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore
            echo "STORE_PASS=$KEYSTORE_PASSWORD" >> $GITHUB_ENV
            echo "ALIAS_NAME=$KEY_ALIAS" >> $GITHUB_ENV
            echo "KEY_PASS=$KEY_PASSWORD" >> $GITHUB_ENV
            echo "Using repository GitHub Secrets keystore." > ../../release-info/KEYSTORE_NOTES.txt
          else
            keytool -genkeypair -v \
              -keystore release.keystore \
              -alias shivkhata \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass ShivKhata@2026 \
              -keypass ShivKhata@2026 \
              -dname "CN=Shiv Khata Book, OU=Mobile, O=Shiv Traders, L=Jaipur, ST=RJ, C=IN"
            cp release.keystore ../../release-info/shivkhata-upload-keystore.jks
            echo "STORE_PASS=ShivKhata@2026" >> $GITHUB_ENV
            echo "ALIAS_NAME=shivkhata" >> $GITHUB_ENV
            echo "KEY_PASS=ShivKhata@2026" >> $GITHUB_ENV
            echo "Auto-generated shivkhata-upload-keystore.jks (Save this file safely for future Play Store updates!)." > ../../release-info/KEYSTORE_NOTES.txt
          fi
          keytool -list -v -keystore release.keystore -storepass "$STORE_PASS" -alias "$ALIAS_NAME" | grep -E "SHA256:|SHA1:" > ../../release-info/SHA256_FINGERPRINT.txt || true
          cat ../../release-info/SHA256_FINGERPRINT.txt >> $GITHUB_STEP_SUMMARY

      - name: Build Debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Build Signed Release APK & Google Play Store AAB
        working-directory: android
        run: |
          gradle assembleRelease bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$(pwd)/app/release.keystore" \
            -Pandroid.injected.signing.store.password="$STORE_PASS" \
            -Pandroid.injected.signing.key.alias="$ALIAS_NAME" \
            -Pandroid.injected.signing.key.password="$KEY_PASS"

      - name: Upload Signed APK, Play Store AAB & Keystore Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ShivKhataBook-PlayStore-Build
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
            release-info/*
          retention-days: 30
